<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuuv Jauhari · Harbour Town</title>
<meta name="description" content="Yuuv Jauhari's work as a walled voxel town on a coastal hill: walk Yuuv from the sea gate up its streets to each district, one per chapter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<script>
  // Arriving through the portfolio's 3D door: keep the night-blue it left on screen; js/arrive.js lets its cubes fall away.
  (function () {
    var from = null; try { from = sessionStorage.getItem('yj-arrive'); if (from) sessionStorage.removeItem('yj-arrive'); } catch (e) {}
    if (from === '3d' && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('arriving-3d');
      setTimeout(function () { document.documentElement.classList.remove('arriving-3d'); }, 4000); // never left blank
    }
  })();
</script>
<style>
  :root {
    --night: 1;
    --ink: #f3ede2; --soft: #c2bbcc; --faint: #948ca6;
    --glass: rgba(16, 15, 31, 0.76); --glass-2: rgba(30, 27, 52, 0.72); --line: rgba(255, 234, 204, 0.14);
    --warm: #ffc56b; --warm-2: #ffdca0; --cyan: #6ff2ff;
    --display: "Fraunces", Georgia, serif; --text: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
    --r: 16px;
  }
  html.arriving-3d { background: #1b1830; }
  html.arriving-3d body { visibility: hidden; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { color: var(--ink); background: #0b0a1a; font: 400 15px/1.5 var(--text); -webkit-font-smoothing: antialiased; }
  body::before, body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  body::before { background: linear-gradient(#78b4e3 0%, #b9dcf2 55%, #d8ecf6 100%); }
  body::after { background: radial-gradient(ellipse at 50% 120%, #3a2a6e 0%, transparent 60%), linear-gradient(#050818 0%, #120f33 55%, #1d1840 100%); opacity: var(--night); }
  canvas { position: fixed; inset: 0; z-index: 1; width: 100vw; height: 100vh; display: block; cursor: default; touch-action: manipulation; }
  #world { touch-action: none; } /* pinch zooms the town, not the page */
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .skip { position: absolute; left: -9999px; top: 8px; z-index: 30; padding: 8px 14px; border-radius: 999px; background: var(--ink); color: #15131f; }
  .skip:focus { left: 12px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---- the top bar */
  .bar { position: fixed; z-index: 10; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .owner { margin: 0; flex: none; padding: 7px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font: 600 17px/1.2 var(--display); letter-spacing: -0.01em; }
  .places { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); overflow-x: auto; scrollbar-width: none; }
  .places::-webkit-scrollbar { display: none; }
  .places button { flex: none; border: 0; background: none; padding: 6px 11px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--soft); white-space: nowrap; }
  .places button { display: grid; justify-items: center; line-height: 1.15; padding: 5px 12px 6px; border-radius: 14px; }
  .places button small { font-size: 10.5px; font-weight: 500; color: var(--faint); letter-spacing: 0.01em; }
  .places button[aria-current] small { color: rgba(22, 18, 31, 0.7); }
  .places button:hover { color: var(--ink); background: rgba(255, 255, 255, 0.07); }
  .places button[aria-current] { color: #16121f; background: var(--warm); }
  .places-wrap { min-width: 0; }
  .pill { display: inline-flex; align-items: center; padding: 7px 13px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13.5px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .pill:hover { border-color: rgba(111, 242, 255, 0.55); }
  #night { margin-left: auto; flex: none; }
  .out { display: flex; gap: 6px; margin: 0; flex: none; }
  #night { color: var(--cyan); }

  /* ---- the panel (a bottom sheet on phones) */
  .panel { position: fixed; z-index: 9; top: 64px; right: 16px; bottom: 16px; width: min(380px, 36vw); display: flex; flex-direction: column; border-radius: 20px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.7); }
  .panel[data-open="false"] { bottom: auto; width: auto; }
  .panel[data-open="false"] .panel-body { display: none; }
  .sheet { position: absolute; top: 12px; right: 12px; z-index: 2; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass-2); font-size: 12.5px; color: var(--soft); }
  .panel[data-open="false"] .sheet { position: static; margin: 8px; }
  .panel-body { flex: 1; overflow-y: auto; padding: 22px 24px 26px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.2) transparent; }
  .panel-body:focus { outline: none; }
  .kicker { margin: 0 0 6px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--warm); }
  .panel h2 { margin: 0; font: 600 27px/1.12 var(--display); letter-spacing: -0.02em; padding-right: 48px; }
  .panel h2:focus { outline: none; }
  .lede { margin: 12px 0 0; color: var(--soft); font-size: 15.5px; }
  .based { margin: 8px 0 0; color: var(--faint); font-size: 13.5px; }
  .hint { margin: 18px 0 10px; font-size: 13px; color: var(--faint); }
  .back { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 16px; padding: 5px 12px 5px 9px; border-radius: 999px; border: 1px solid var(--line); background: none; font-size: 12.5px; color: var(--soft); }
  .back::before { content: ""; width: 7px; height: 7px; border-left: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin-left: 3px; }
  .back:hover { color: var(--ink); border-color: rgba(255, 255, 255, 0.3); }
  .items { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 6px; }
  .items button { width: 100%; display: grid; gap: 2px; text-align: left; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.035); transition: border-color 0.15s, background 0.15s; }
  .items button:hover { border-color: rgba(255, 197, 107, 0.5); background: rgba(255, 197, 107, 0.07); }
  .items .t, .pager .t { font: 600 16.5px/1.25 var(--display); }
  .items .s, .pager .s { font-size: 12.5px; color: var(--faint); }
  .card .metric { margin: 14px 0 0; color: var(--soft); font-size: 14px; }
  .card .metric b { display: block; font: 600 34px/1.05 var(--display); color: var(--warm-2); }
  .card .blurb { margin: 14px 0 0; font-size: 15.5px; }
  .card .detail { margin: 10px 0 0; color: var(--soft); }
  .card .note { margin: 12px 0 0; padding-left: 10px; border-left: 2px solid var(--cyan); color: var(--cyan); font-size: 13px; }
  .tags { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .tags li { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; color: var(--soft); }
  .links { margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-flex; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); text-decoration: none; font-size: 14px; font-weight: 500; background: rgba(255, 255, 255, 0.04); }
  .btn:hover { border-color: rgba(255, 255, 255, 0.35); }
  .btn.primary { background: var(--warm); border-color: var(--warm); color: #17121c; }
  .btn.primary:hover { background: var(--warm-2); }
  .mail { margin: 18px 0 0; font: 600 20px/1.3 var(--display); word-break: break-all; }
  .mail a { text-decoration-color: rgba(255, 197, 107, 0.6); text-underline-offset: 4px; }
  .extra { margin-top: 18px; color: var(--soft); font-size: 14.5px; }
  .extra > :first-child { margin-top: 0; }
  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 22px; }
  .pager button { display: grid; gap: 1px; text-align: left; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: none; }
  .pager button.next { text-align: right; }
  .pager button:hover { border-color: rgba(255, 197, 107, 0.5); }

  /* ---- labels over the canvas */
  .labels { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  .labels > * { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity 0.35s; will-change: transform; }
  .labels > .on { opacity: 1; }
  .tag { pointer-events: none; display: grid; justify-items: center; gap: 1px; padding: 6px 12px 7px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; }
  .tag.on { pointer-events: auto; }
  .tag b { font: 600 14.5px/1.2 var(--display); }
  .tag span { font-size: 11.5px; color: var(--soft); }
  .tag:hover { border-color: rgba(255, 197, 107, 0.6); }
  .nameplate { display: grid; justify-items: center; text-align: center; gap: 4px; text-shadow: 0 2px 18px rgba(4, 3, 16, 0.85), 0 0 2px rgba(4, 3, 16, 0.9); }
  .nameplate b { font: 600 clamp(26px, 3.2vw, 40px)/1 var(--display); letter-spacing: -0.02em; white-space: nowrap; }
  .nameplate span { font-size: 14px; color: var(--ink); opacity: 0.9; max-width: 30ch; }
  .nameplate.compact { margin-top: -26px; }
  .nameplate.compact b { font-size: 24px; }
  .nameplate.compact span { display: none; }
  .tip { padding: 4px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
  /* the loading screen: up until the town is built and warmed, so the first thing seen runs smoothly */
  .loading { position: fixed; inset: 0; z-index: 40; display: grid; place-content: center; justify-items: center; gap: 18px; background: radial-gradient(ellipse at 50% 120%, #3a2a6e 0%, transparent 60%), linear-gradient(#050818 0%, #120f33 55%, #1d1840 100%); transition: opacity 0.5s ease; }
  .loading.done { opacity: 0; pointer-events: none; }
  .loading p { margin: 0; font: 600 17px/1.2 var(--display); color: var(--soft); }
  .isle { position: relative; width: 300px; height: 250px; animation: bob 3.2s ease-in-out 2.6s infinite; transition: transform 0.6s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.5s; }
  .loading.done .isle { transform: scale(2.4); opacity: 0; animation: none; }
  .isle svg { position: absolute; width: 26px; height: 30px; animation: drop 0.55s cubic-bezier(0.3, 1.4, 0.5, 1) both; }
  .isle svg.glow { filter: drop-shadow(0 0 6px rgba(111, 242, 255, 0.8)); animation: drop 0.55s cubic-bezier(0.3, 1.4, 0.5, 1) both, pulse 1.6s ease-in-out infinite; }
  @keyframes drop { from { transform: translateY(-140px); opacity: 0; } 40% { opacity: 1; } to { transform: none; opacity: 1; } }
  @keyframes pulse { 50% { filter: drop-shadow(0 0 12px rgba(111, 242, 255, 1)) brightness(1.25); } }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .isle, .isle svg, .isle svg.glow { animation: none; } .loading, .isle { transition: none; } }
  /* the first-time note over Yuuv, and the names over things you can open (with a marker until opened) */
  .hint { position: fixed; left: 0; top: 0; z-index: 6; margin: 0; padding: 7px 13px 8px; border-radius: 12px; background: var(--glass); border: 1px solid rgba(255, 197, 107, 0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13.5px; font-weight: 500; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.4s; }
  .hint.on { opacity: 1; }
  .qlabel { display: grid; justify-items: center; gap: 1px; padding: 4px 10px 5px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: var(--ink); cursor: pointer; }
  .qlabel.on { pointer-events: auto; }
  .qlabel b { font: 600 13px/1.2 var(--display); }
  .qlabel span { font-size: 11px; color: var(--warm); }
  .qlabel.done span { display: none; }
  .qlabel:hover { border-color: rgba(255, 197, 107, 0.6); }
  .bubble { position: fixed; left: 0; top: 0; z-index: 7; width: max-content; max-width: min(290px, 72vw); pointer-events: none; opacity: 0; transition: opacity 0.25s; }
  .bubble.on { opacity: 1; pointer-events: auto; }
  .bubble .in { position: relative; padding: 11px 15px 12px; border-radius: 14px; background: var(--glass); border: 1px solid rgba(255, 197, 107, 0.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.8); transform-origin: 50% 100%; animation: pop 0.3s cubic-bezier(0.3, 1.4, 0.5, 1); }
  .bubble .in::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; margin-left: -6px; background: rgba(16, 15, 31, 0.92); border-right: 1px solid rgba(255, 197, 107, 0.55); border-bottom: 1px solid rgba(255, 197, 107, 0.55); transform: rotate(45deg); }
  .bubble .k { margin: 0 0 3px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--warm); }
  .bubble h3 { margin: 0; font: 600 17px/1.2 var(--display); }
  .bubble.small h3 { font-size: 14.5px; }
  .bubble .m { margin: 6px 0 0; } .bubble .m b { font: 600 20px/1 var(--display); color: var(--warm-2); } .bubble .m span { font-size: 12px; color: var(--soft); }
  .bubble .b { margin: 5px 0 0; font-size: 13px; line-height: 1.45; color: var(--soft); }
  .bubble .more { margin-top: 9px; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(255, 197, 107, 0.55); background: rgba(255, 197, 107, 0.14); color: var(--ink); font: 500 12.5px/1.2 var(--text); cursor: pointer; }
  .bubble .more:hover { background: rgba(255, 197, 107, 0.26); }
  @keyframes pop { from { transform: scale(0.8); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .bubble .in { animation: none; } }
  .back-to { position: fixed; z-index: 8; transform: translateX(-50%); border-color: rgba(111, 242, 255, 0.45); cursor: pointer; color: var(--ink); }
  .back-to:hover { border-color: rgba(111, 242, 255, 0.8); }
  .back-to[hidden] { display: none; }
  #world { cursor: grab; }
  .status { position: fixed; z-index: 11; left: 16px; bottom: 16px; margin: 0; max-width: min(420px, calc(100vw - 32px)); padding: 9px 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); font-size: 13.5px; }

  /* ---- mid widths: the places get a row of their own */
  @media (min-width: 760px) and (max-width: 1179px) {
    .bar { flex-wrap: wrap; row-gap: 8px; }
    .places-wrap { order: 3; flex: 1 1 100%; }
    .places { display: inline-flex; max-width: 100%; }
    .panel { top: 112px; }
  }
  /* ---- phones: the bar in rows, the panel as a bottom sheet */
  @media (max-width: 759px) {
    .bar { flex-wrap: wrap; padding: 10px 12px; gap: 6px 8px; }
    .owner { order: 1; font-size: 15.5px; padding: 5px 12px; }
    .out { order: 2; margin-left: auto; gap: 12px; }
    .out .pill { padding: 4px 0; background: none; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; font-size: 12.5px; text-decoration: underline; text-decoration-color: rgba(243, 237, 226, 0.4); text-underline-offset: 3px; text-shadow: 0 1px 8px rgba(4, 3, 16, 0.9); }
    .places-wrap { order: 3; flex: 1 1 200px; }
    #night { order: 4; margin-left: 0; padding: 6px 12px; font-size: 13px; }
    .places button { padding: 5px 10px; font-size: 13px; }
    .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 43vh; border-radius: 18px; }
    .panel[data-open="false"] { left: auto; }
    .panel-body { padding: 18px 18px 20px; }
    .panel h2 { font-size: 23px; }
    .nameplate b { font-size: 24px; }
    .nameplate span { font-size: 12.5px; }
    .tag { padding: 5px 10px 6px; }
    .tag span { font-size: 10.5px; }
  }
  @media (prefers-reduced-motion: reduce) { .labels > *, .items button { transition: none; } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="js/arrive.js"></script>
<script type="module" src="js/world.js"></script>
</head>
<body>
<header id="bar" class="bar">
  <a class="skip" href="#panel-body">Skip to the content</a>
  <h1 class="owner" id="owner">Yuuv Jauhari</h1>
  <nav class="places-wrap" aria-label="Places in the town"><div id="places" class="places"></div></nav>
  <button id="night" class="pill" type="button">Day</button>
  <p class="out"><a class="pill" href="../reel/">2D version</a><a class="pill" id="short" href="../">Prefer the short version?</a></p>
</header>
<canvas id="world" aria-hidden="true"></canvas>
<div id="labels" class="labels"></div>
<aside id="panel" class="panel" data-open="true" aria-labelledby="panel-title">
  <button id="sheet" class="sheet" type="button" aria-expanded="true" aria-controls="panel-body">Hide</button>
  <div id="panel-body" class="panel-body" tabindex="-1"></div>
</aside>
<p id="status" class="status" role="status" hidden></p>
<div id="loading" class="loading" role="status"><div class="isle" id="isle" aria-hidden="true"></div><p>Building the town</p></div>
<script>
  // While the town builds, a little floating island assembles itself cube by cube: rock from the bottom up, then grass,
  // then a tower with a glowing window, a tree and a lantern. CSS runs the animation, so it keeps moving while the
  // page is busy building the real one.
  (function () {
    var M = { rock: ['#6d6a80', '#4d4a62', '#37354a'], dirt: ['#5fae4e', '#6b4a32', '#4f3524'], stone: ['#a39cbc', '#736d8f', '#555070'],
      leaf: ['#4fa257', '#357a3d', '#265d2e'], glow: ['#d6fdff', '#6ff2ff', '#1d7f96'], roof: ['#7a5bd6', '#553ca8', '#3e2b80'] };
    var cubes = [], add = function (i, j, k, m, order) { cubes.push({ i: i, j: j, k: k, m: m, order: order }); };
    for (var k = -3; k <= 0; k++) { var r = 4.3 + k * 1.05 + (k === 0 ? 0.35 : 0);
      for (var i = -5; i <= 5; i++) for (var j = -5; j <= 5; j++) if (i * i + j * j <= r * r) add(i, j, k, k === 0 ? 'dirt' : 'rock', (k + 3) * 100 + Math.hypot(i, j) * 6); }
    [1, 2, 3].forEach(function (k) { add(0, 0, k, k === 2 ? 'glow' : 'stone', 420 + k * 10); add(1, 0, k, 'stone', 421 + k * 10); add(0, 1, k, 'stone', 422 + k * 10); add(1, 1, k, 'stone', 423 + k * 10); });
    add(0, 0, 4, 'roof', 470); add(1, 0, 4, 'roof', 471); add(0, 1, 4, 'roof', 472); add(1, 1, 4, 'roof', 473); add(0.5, 0.5, 5, 'roof', 480);
    add(-2, 2, 1, 'leaf', 490); add(-2, 2, 2, 'leaf', 495); add(-3, 2, 2, 'leaf', 497); add(-2, 3, 2, 'leaf', 498); add(-2, 2, 3, 'leaf', 500);
    add(2, -2, 1, 'stone', 505); add(2, -2, 2, 'glow', 510);
    var el = document.getElementById('isle'), byOrder = cubes.slice().sort(function (a, b) { return a.order - b.order; });
    byOrder.forEach(function (c, n) { c.delay = 0.12 + n * (2.1 / byOrder.length); });
    cubes.sort(function (a, b) { return (a.i + a.j) - (b.i + b.j) || a.k - b.k; }).forEach(function (c) {
      var f = M[c.m], svg = '<svg viewBox="0 0 26 30" class="' + (c.m === 'glow' ? 'glow' : '') + '" style="left:' + (137 + (c.i - c.j) * 13) + 'px;top:' + (110 + (c.i + c.j) * 7.5 - c.k * 15) + 'px;animation-delay:' + c.delay.toFixed(2) + 's' + (c.m === 'glow' ? ',' + (c.delay + 0.55).toFixed(2) + 's' : '') + '">'
        + '<path d="M13 0 26 7.5 13 15 0 7.5z" fill="' + f[0] + '"/><path d="M0 7.5 13 15 13 30 0 22.5z" fill="' + f[1] + '"/><path d="M13 15 26 7.5 26 22.5 13 30z" fill="' + f[2] + '"/></svg>';
      el.insertAdjacentHTML('beforeend', svg);
    });
  })();
  setTimeout(function () { var l = document.getElementById('loading'); if (l) l.remove(); }, 20000); // never stuck behind it if the town fails
</script>

</body>
</html>
